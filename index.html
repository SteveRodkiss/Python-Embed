<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Python Editor</title>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>

  <!-- Monaco -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/editor/editor.main.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    #page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
    }

    .page-layout {
      display: flex;
      align-items: flex-start;
      gap: 24px;
    }

    #exerciseContent {
      flex: 1;
      min-width: 0;
    }

    #exerciseSidebar {
      flex: 0 0 220px;
      position: sticky;
      top: 16px;
    }

    #exerciseSidebar h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    #exerciseList {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
    }

    .exercise-button {
      width: 100%;
      text-align: left;
      background: #eeeeee;
      color: #222;
    }

    .exercise-button.active {
      background: #1a73e8;
      color: white;
    }

    .exercise-button:focus-visible {
      outline: 2px solid #174ea6;
      outline-offset: 2px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
    }

    #instructions {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    #editor {
      width: 100%;
      height: 360px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 4px;
      padding: 9px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    #runButton {
      background: #1a73e8;
      color: white;
    }

    #resetButton {
      background: #eeeeee;
      color: #222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .section-title {
      font-weight: bold;
      margin: 12px 0 6px 0;
    }

    #inputArea {
      width: 100%;
      min-height: 80px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
    }

    #inputHelp {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    #output {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      margin: 0;
      background: #1e1e1e;
      color: #f1f1f1;
      border-radius: 4px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.45;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    #hint {
      margin-top: 12px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
      display: none;
    }

    #errorBox {
      margin-top: 12px;
      display: none;
    }

    @media (max-width: 760px) {
      .page-layout {
        flex-direction: column;
      }

      #exerciseSidebar {
        position: static;
        flex: auto;
        width: 100%;
      }

      #exerciseList {
        max-height: 220px;
      }
    }
  </style>
</head>

<body>

<div id="page">

  <div class="page-layout">
    <main id="exerciseContent">
      <h2 id="title">Loading exercise...</h2>

      <div id="instructions"></div>

      <div id="editor"></div>

      <div class="controls">
        <button id="runButton" disabled>Run</button>
        <button id="resetButton" disabled>Reset</button>
      </div>

      <div id="status">Loading...</div>

      <div id="inputSection">
        <div class="section-title">Program input</div>

        <textarea
          id="inputArea"
          placeholder="If your program uses input(), enter the answers here, one per line."
        ></textarea>

        <div id="inputHelp">
          Each line supplies one answer to an input() call.
        </div>
      </div>

      <div class="section-title">Output</div>

      <pre id="output"></pre>

      <div id="hint"></div>
    </main>

    <aside id="exerciseSidebar" aria-label="Exercise navigation">
      <h3>Problems</h3>
      <nav id="exerciseList" aria-label="Problems"></nav>
    </aside>
  </div>

</div>


<!-- Monaco loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>


<script>

  /* =========================================================
     PAGE ELEMENTS
     ========================================================= */

  const titleElement =
    document.getElementById("title");

  const instructionsElement =
    document.getElementById("instructions");

  const outputElement =
    document.getElementById("output");

  const inputArea =
    document.getElementById("inputArea");

  const statusElement =
    document.getElementById("status");

  const hintElement =
    document.getElementById("hint");

  const runButton =
    document.getElementById("runButton");

  const resetButton =
    document.getElementById("resetButton");

  const exerciseListElement =
    document.getElementById("exerciseList");


  /* =========================================================
     GET EXERCISE ID FROM URL
     
     Example:
     
     editor.html?exercise=debug01
     ========================================================= */

  const params =
    new URLSearchParams(window.location.search);

  let exerciseName =
    params.get("exercise") || "default";


  /* =========================================================
     GLOBAL VARIABLES
     ========================================================= */

  let exercises = {};

  let exercise = null;

  let editor = null;

  let editorLoading = false;

  let pyodide = null;

  let pyodideReadyPromise = null;

  let pythonStatus = "Loading Python...";


  /* =========================================================
     LOAD EXERCISES.JSON
     ========================================================= */

  async function loadExercises() {

    try {

      /*
       * exercises.json lives in the same GitHub Pages
       * directory as editor.html.
       */
      const response =
        await fetch("./exercises.json", {
          cache: "no-cache"
        });


      if (!response.ok) {
        throw new Error(
          "Could not load exercises.json (" +
          response.status +
          ")"
        );
      }


      exercises =
        await response.json();

      renderExerciseList();

      /*
       * Find the requested exercise.
       */
      exercise =
        exercises[exerciseName];


      if (!exercise) {

        throw new Error(
          'Exercise "' +
          exerciseName +
          '" was not found in exercises.json.'
        );

      }

      selectExercise(exerciseName, false);


    } catch (error) {

      titleElement.textContent =
        "Unable to load exercise";

      instructionsElement.textContent =
        error.message;

      statusElement.textContent =
        "Error loading exercise.";

    }

  }

  function renderExerciseList() {

    exerciseListElement.textContent = "";

    Object.entries(exercises).forEach(
      function ([name, item]) {

        const button =
          document.createElement("button");

        button.type = "button";
        button.className = "exercise-button";
        button.dataset.exercise = name;
        button.textContent = item.title;
        button.addEventListener(
          "click",
          function () {
            selectExercise(name, true);
          }
        );

        exerciseListElement.appendChild(button);

      }
    );

  }


  function selectExercise(name, updateUrl) {

    const selectedExercise =
      exercises[name];

    if (!selectedExercise) {
      return;
    }

    exerciseName = name;
    exercise = selectedExercise;

    titleElement.textContent =
      exercise.title;

    instructionsElement.textContent =
      exercise.instructions;

    hintElement.textContent =
      exercise.hint ? "Hint: " + exercise.hint : "";

    hintElement.style.display =
      exercise.hint ? "block" : "none";

    if (editor) {
      editor.setValue(exercise.code);
      editor.focus();
    } else {
      createEditor();
    }

    inputArea.value = "";
    outputElement.textContent = "";
    statusElement.textContent = pythonStatus;
    document.title = exercise.title + " | Python Editor";

    Array.from(exerciseListElement.children).forEach(
      function (button) {

        const active =
          button.dataset.exercise === name;

        button.classList.toggle("active", active);

        if (active) {
          button.setAttribute("aria-current", "page");
        } else {
          button.removeAttribute("aria-current");
        }

      }
    );

    if (updateUrl) {
      const url = new URL(window.location.href);
      url.searchParams.set("exercise", name);
      window.history.replaceState(null, "", url);
    }

  }


  /* =========================================================
     CREATE MONACO EDITOR
     ========================================================= */

  function createEditor() {

    if (editor || editorLoading || !exercise) {
      return;
    }

    editorLoading = true;

    require.config({
      paths: {
        vs:
          "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs"
      }
    });


    require(
      ["vs/editor/editor.main"],
      function () {

        editor =
          monaco.editor.create(
            document.getElementById("editor"),
            {

              value: exercise.code,

              language: "python",

              /*
               * Dark mode
               */
              theme: "vs-dark",

              automaticLayout: true,

              minimap: {
                enabled: false
              },

              fontSize: 15,

              tabSize: 4,

              insertSpaces: true,

              wordWrap: "off",

              scrollBeyondLastLine: false

            }
          );

        editorLoading = false;

        resetButton.disabled = false;

        statusElement.textContent =
          pythonStatus;

      }
    );

  }


  /* =========================================================
     LOAD PYODIDE
     ========================================================= */

  async function loadPython() {

    try {

      pyodide =
        await loadPyodide();


      /*
       * Standard output.
       */
      pyodide.setStdout({

        batched: function(text) {

          outputElement.textContent +=
            text;

        }

      });


      /*
       * Standard error.
       */
      pyodide.setStderr({

        batched: function(text) {

          outputElement.textContent +=
            text;

        }

      });


      statusElement.textContent =
        "Python ready.";

      pythonStatus = "Python ready.";
      runButton.disabled = false;


    } catch (error) {

      statusElement.textContent =
        "Could not load Python.";

      pythonStatus = "Could not load Python.";
      outputElement.textContent =
        error.message;

    }

  }


  /*
   * Start loading Python immediately.
   */
  pyodideReadyPromise =
    loadPython();


  /* =========================================================
     RUN PYTHON
     ========================================================= */

  async function runPython() {

    if (!editor || !exercise) {
      return;
    }


    runButton.disabled = true;

    outputElement.textContent = "";

    statusElement.textContent =
      "Running...";


    try {

      await pyodideReadyPromise;


      /*
       * Get the student's code exactly as written.
       *
       * We do NOT rewrite input(), print(), etc.
       */
      const code =
        editor.getValue();


      /*
       * Prepare input.
       *
       * Each line in the input box becomes one response
       * to an input() call.
       */
      const inputLines =
        inputArea.value.split(/\r?\n/);


      let inputIndex = 0;


      /*
       * Supply normal Python stdin.
       */
      pyodide.setStdin({

        stdin: function() {

          if (inputIndex >= inputLines.length) {

            /*
             * End-of-file.
             *
             * Python will turn this into EOFError.
             */
            return null;

          }


          const value =
            inputLines[inputIndex];

          inputIndex++;

          return value;

        },

        isatty: false

      });


      /*
       * Fresh namespace for every run.
       *
       * This prevents variables from a previous run
       * surviving into the next run.
       */
      const namespace =
        pyodide.toPy({});


      /*
       * Give Python a sensible filename.
       *
       * This makes the traceback much more useful.
       */
      const filename =
        exerciseName + ".py";


      /*
       * Run the student's actual Python.
       */
      await pyodide.runPythonAsync(
        code,
        {
          globals: namespace,
          locals: namespace,
          filename: filename
        }
      );


      namespace.destroy();


      statusElement.textContent =
        "Finished.";


    } catch (error) {

      /*
       * Display the actual Python traceback.
       *
       * Don't replace it with a simplified error message.
       */
      let message = "";

      if (error && error.message) {
        message = error.message;
      } else {
        message = String(error);
      }


      /*
       * Remove the JavaScript wrapper that Pyodide
       * sometimes places around the Python exception.
       */
      if (message.startsWith("PythonError:")) {

        message =
          message
            .substring("PythonError:".length)
            .trim();

      }


      outputElement.textContent +=
        message;


      statusElement.textContent =
        "Program finished with an error.";

    }


    finally {

      runButton.disabled = false;

    }

  }


  /* =========================================================
     RESET
     ========================================================= */

  function resetEditor() {

    if (!editor || !exercise) {
      return;
    }


    editor.setValue(
      exercise.code
    );


    inputArea.value = "";

    outputElement.textContent = "";

    statusElement.textContent =
      "Ready.";

    editor.focus();

  }


  /* =========================================================
     BUTTONS
     ========================================================= */

  runButton.addEventListener(
    "click",
    runPython
  );


  resetButton.addEventListener(
    "click",
    resetEditor
  );


  /* =========================================================
     CTRL + ENTER = RUN
     ========================================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key === "Enter"
      ) {

        event.preventDefault();

        runPython();

      }

    }
  );


  /* =========================================================
     START
     ========================================================= */

  loadExercises();

</script>

</body>
</html>
