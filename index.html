<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Python Editor</title>

  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>

  <!-- Monaco -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/editor/editor.main.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222;
    }

    #page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
    }

    h2 {
      margin: 0 0 8px 0;
      font-size: 22px;
    }

    #instructions {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    #editor {
      width: 100%;
      height: 360px;
      border: 1px solid #ccc;
      margin-bottom: 12px;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 4px;
      padding: 9px 16px;
      font-size: 15px;
      cursor: pointer;
    }

    #runButton {
      background: #1a73e8;
      color: white;
    }

    #resetButton {
      background: #eeeeee;
      color: #222;
    }

    button:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .section-title {
      font-weight: bold;
      margin: 12px 0 6px 0;
    }

    #inputArea {
      width: 100%;
      min-height: 80px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
      font-size: 14px;
      resize: vertical;
    }

    #inputHelp {
      font-size: 13px;
      color: #666;
      margin-top: 4px;
    }

    #output {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      margin: 0;
      background: #1e1e1e;
      color: #f1f1f1;
      border-radius: 4px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: Consolas, Monaco, monospace;
      font-size: 14px;
      line-height: 1.45;
    }

    #status {
      font-size: 13px;
      color: #666;
      margin-bottom: 8px;
    }

    #hint {
      margin-top: 12px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
      display: none;
    }

    #errorBox {
      margin-top: 12px;
      display: none;
    }
  </style>
</head>

<body>

<div id="page">

  <h2 id="title">Loading exercise...</h2>

  <div id="instructions"></div>

  <div id="editor"></div>

  <div class="controls">
    <button id="runButton" disabled>Run</button>
    <button id="resetButton" disabled>Reset</button>
  </div>

  <div id="status">Loading...</div>

  <div id="inputSection">
    <div class="section-title">Program input</div>

    <textarea
      id="inputArea"
      placeholder="If your program uses input(), enter the answers here, one per line."
    ></textarea>

    <div id="inputHelp">
      Each line supplies one answer to an input() call.
    </div>
  </div>

  <div class="section-title">Output</div>

  <pre id="output"></pre>

  <div id="hint"></div>

</div>


<!-- Monaco loader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>


<script>

  /* =========================================================
     PAGE ELEMENTS
     ========================================================= */

  const titleElement =
    document.getElementById("title");

  const instructionsElement =
    document.getElementById("instructions");

  const outputElement =
    document.getElementById("output");

  const inputArea =
    document.getElementById("inputArea");

  const statusElement =
    document.getElementById("status");

  const hintElement =
    document.getElementById("hint");

  const runButton =
    document.getElementById("runButton");

  const resetButton =
    document.getElementById("resetButton");


  /* =========================================================
     GET EXERCISE ID FROM URL
     
     Example:
     
     editor.html?exercise=debug01
     ========================================================= */

  const params =
    new URLSearchParams(window.location.search);

  const exerciseName =
    params.get("exercise") || "default";


  /* =========================================================
     GLOBAL VARIABLES
     ========================================================= */

  let exercises = {};

  let exercise = null;

  let editor = null;

  let pyodide = null;

  let pyodideReadyPromise = null;


  /* =========================================================
     LOAD EXERCISES.JSON
     ========================================================= */

  async function loadExercises() {

    try {

      /*
       * exercises.json lives in the same GitHub Pages
       * directory as editor.html.
       */
      const response =
        await fetch("./exercises.json", {
          cache: "no-cache"
        });


      if (!response.ok) {
        throw new Error(
          "Could not load exercises.json (" +
          response.status +
          ")"
        );
      }


      exercises =
        await response.json();


      /*
       * Find the requested exercise.
       */
      exercise =
        exercises[exerciseName];


      if (!exercise) {

        throw new Error(
          'Exercise "' +
          exerciseName +
          '" was not found in exercises.json.'
        );

      }


      /*
       * Fill in the page.
       */
      titleElement.textContent =
        exercise.title;

      instructionsElement.textContent =
        exercise.instructions;


      if (exercise.hint) {

        hintElement.textContent =
          "Hint: " + exercise.hint;

        hintElement.style.display =
          "block";

      }


      /*
       * Create the Monaco editor now that we have
       * the exercise code.
       */
      createEditor(exercise.code);


    } catch (error) {

      titleElement.textContent =
        "Unable to load exercise";

      instructionsElement.textContent =
        error.message;

      statusElement.textContent =
        "Error loading exercise.";

    }

  }


  /* =========================================================
     CREATE MONACO EDITOR
     ========================================================= */

  function createEditor(code) {

    require.config({
      paths: {
        vs:
          "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs"
      }
    });


    require(
      ["vs/editor/editor.main"],
      function () {

        editor =
          monaco.editor.create(
            document.getElementById("editor"),
            {

              value: code,

              language: "python",

              /*
               * Dark mode
               */
              theme: "vs-dark",

              automaticLayout: true,

              minimap: {
                enabled: false
              },

              fontSize: 15,

              tabSize: 4,

              insertSpaces: true,

              wordWrap: "off",

              scrollBeyondLastLine: false

            }
          );


        resetButton.disabled = false;

        statusElement.textContent =
          "Loading Python...";

      }
    );

  }


  /* =========================================================
     LOAD PYODIDE
     ========================================================= */

  async function loadPython() {

    try {

      pyodide =
        await loadPyodide();


      /*
       * Standard output.
       */
      pyodide.setStdout({

        batched: function(text) {

          outputElement.textContent +=
            text;

        }

      });


      /*
       * Standard error.
       */
      pyodide.setStderr({

        batched: function(text) {

          outputElement.textContent +=
            text;

        }

      });


      statusElement.textContent =
        "Python ready.";

      runButton.disabled = false;


    } catch (error) {

      statusElement.textContent =
        "Could not load Python.";

      outputElement.textContent =
        error.message;

    }

  }


  /*
   * Start loading Python immediately.
   */
  pyodideReadyPromise =
    loadPython();


  /* =========================================================
     RUN PYTHON
     ========================================================= */

  async function runPython() {

    if (!editor || !exercise) {
      return;
    }


    runButton.disabled = true;

    outputElement.textContent = "";

    statusElement.textContent =
      "Running...";


    try {

      await pyodideReadyPromise;


      /*
       * Get the student's code exactly as written.
       *
       * We do NOT rewrite input(), print(), etc.
       */
      const code =
        editor.getValue();


      /*
       * Prepare input.
       *
       * Each line in the input box becomes one response
       * to an input() call.
       */
      const inputLines =
        inputArea.value.split(/\r?\n/);


      let inputIndex = 0;


      /*
       * Supply normal Python stdin.
       */
      pyodide.setStdin({

        stdin: function() {

          if (inputIndex >= inputLines.length) {

            /*
             * End-of-file.
             *
             * Python will turn this into EOFError.
             */
            return null;

          }


          const value =
            inputLines[inputIndex];

          inputIndex++;

          return value;

        },

        isatty: false

      });


      /*
       * Fresh namespace for every run.
       *
       * This prevents variables from a previous run
       * surviving into the next run.
       */
      const namespace =
        pyodide.toPy({});


      /*
       * Give Python a sensible filename.
       *
       * This makes the traceback much more useful.
       */
      const filename =
        exerciseName + ".py";


      /*
       * Run the student's actual Python.
       */
      await pyodide.runPythonAsync(
        code,
        {
          globals: namespace,
          locals: namespace,
          filename: filename
        }
      );


      namespace.destroy();


      statusElement.textContent =
        "Finished.";


    } catch (error) {

      /*
       * Display the actual Python traceback.
       *
       * Don't replace it with a simplified error message.
       */
      let message = "";

      if (error && error.message) {
        message = error.message;
      } else {
        message = String(error);
      }


      /*
       * Remove the JavaScript wrapper that Pyodide
       * sometimes places around the Python exception.
       */
      if (message.startsWith("PythonError:")) {

        message =
          message
            .substring("PythonError:".length)
            .trim();

      }


      outputElement.textContent +=
        message;


      statusElement.textContent =
        "Program finished with an error.";

    }


    finally {

      runButton.disabled = false;

    }

  }


  /* =========================================================
     RESET
     ========================================================= */

  function resetEditor() {

    if (!editor || !exercise) {
      return;
    }


    editor.setValue(
      exercise.code
    );


    inputArea.value = "";

    outputElement.textContent = "";

    statusElement.textContent =
      "Ready.";

    editor.focus();

  }


  /* =========================================================
     BUTTONS
     ========================================================= */

  runButton.addEventListener(
    "click",
    runPython
  );


  resetButton.addEventListener(
    "click",
    resetEditor
  );


  /* =========================================================
     CTRL + ENTER = RUN
     ========================================================= */

  document.addEventListener(
    "keydown",
    function(event) {

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key === "Enter"
      ) {

        event.preventDefault();

        runPython();

      }

    }
  );


  /* =========================================================
     START
     ========================================================= */

  loadExercises();

</script>

</body>
</html>
